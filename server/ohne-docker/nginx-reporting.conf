# /etc/nginx/sites-available/reporting  (verlinkt nach sites-enabled)
# Metabase nach außen NUR für eingebettete Dashboards.
#   REPORTING.EXAMPLE.DE   -> Hostname von Metabase, z. B. reporting.luemobil.de
#   HILFECENTER-ADRESSEN   -> alle Adressen des Hilfecenters, Leerzeichen getrennt,
#                             z. B. https://hilfe.luemobil.de https://hilfe-test.luemobil.de
#
# Lokal im Browser getestet (22.09.2026, Metabase 0.63.18): Dashboards laden
# vollständig; die Admin-Oberfläche, Anmeldung und übrige API sind gesperrt;
# eine fremde Seite kann die Dashboards nicht einbetten.

# Das Token steht im Pfad — im Log durch … ersetzen
map $uri $reporting_uri_ohne_token {
  ~^(?<vorne>/(api/)?embed/(dashboard|question)/)[^/]+(?<hinten>.*)$  $vorne…$hinten;
  default $uri;
}
log_format reporting '$time_iso8601 $remote_addr "$request_method $reporting_uri_ohne_token" '
                     '$status $body_bytes_sent ${request_time}s';

# Ein Dashboard lädt 10–15 Kacheln gleichzeitig: großzügig, aber begrenzt
limit_req_zone $binary_remote_addr zone=reporting:10m rate=20r/s;

upstream metabase { server 127.0.0.1:3000; keepalive 16; }

server {
  listen 80;
  listen [::]:80;
  server_name REPORTING.EXAMPLE.DE;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name REPORTING.EXAMPLE.DE;

  ssl_certificate     /etc/letsencrypt/live/REPORTING.EXAMPLE.DE/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/REPORTING.EXAMPLE.DE/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS_REPORTING:1m;

  server_tokens off;
  access_log /var/log/nginx/reporting.log reporting;
  error_log  /var/log/nginx/reporting-fehler.log warn;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options    "nosniff" always;
  # Metabase selbst erlaubt jede einbettende Seite (frame-ancestors *).
  # Diese zweite Richtlinie gilt zusätzlich und beschränkt auf das Hilfecenter.
  add_header Content-Security-Policy   "frame-ancestors HILFECENTER-ADRESSEN" always;

  client_max_body_size 64k;
  limit_req zone=reporting burst=60 nodelay;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 180s;

  # Die Seite des eingebetteten Dashboards
  location /embed/     { limit_except GET { deny all; } proxy_pass http://metabase; }
  # Daten der Kacheln — Metabase prüft hier das signierte Token
  location /api/embed/ { limit_except GET { deny all; } proxy_pass http://metabase; }
  # JavaScript, CSS, Schriften, iframeResizer.js
  location /app/       { limit_except GET { deny all; } proxy_pass http://metabase; }

  # Alles andere: Anmeldung, Admin-Oberfläche, übrige API — gibt es von außen nicht
  location / { return 404; }
}
