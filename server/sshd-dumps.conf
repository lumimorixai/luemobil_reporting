# /etc/ssh/sshd_config.d/sftp.conf — Zugang des Dump-Lieferanten
#
# Auf diesem Server eingerichtet als Benutzer tafreporting in der Gruppe sftponly.
# Er lädt nach /srv/sftp/<benutzer>/upload; der Import liest von dort (ACL für uid 70,
# siehe BETRIEBSHANDBUCH.md 4.2) und trägt die Dumps ins Archiv außerhalb des Chroots.
#
# Verzeichnisrechte, die dazugehören:
#   /srv/sftp/tafreporting          root:root              755   (Chroot, muss root gehören)
#   /srv/sftp/tafreporting/upload   tafreporting:sftponly  750   + ACL u:70:rwx
#
# Kein "-u 0027" bei internal-sftp: Die Dateien wären dann 640 und nur für die
# Gruppe sftponly lesbar — der Import (uid 70) ist dort nicht Mitglied.
# Die 750 auf dem Verzeichnis sperrt Fremde bereits aus.

Match Group sftponly
    ChrootDirectory /srv/sftp/%u
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    # Empfohlen: Anmeldung nur mit Schlüssel. Die Schlüsseldatei liegt außerhalb
    # des Chroots, damit der Lieferant sie nicht selbst ändern kann:
    #   AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    #   PasswordAuthentication no
    #   AuthenticationMethods publickey
    PasswordAuthentication yes
