# /etc/ssh/sshd_config.d/luemobil-dumps.conf
# Der Lieferant der Dumps darf nur per SFTP in /srv/luemobil/dumps/eingang schreiben:
# keine Shell, keine Weiterleitungen, nur mit Schlüssel, eingesperrt in /srv/luemobil/dumps.
Match User dumpupload
    ChrootDirectory /srv/luemobil/dumps
    ForceCommand internal-sftp -u 0007 -d /eingang
    PasswordAuthentication no
    AuthenticationMethods publickey
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
