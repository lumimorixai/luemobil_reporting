# /etc/nginx/sites-available/tickets-api  (verlinkt nach sites-enabled)
# Serverfassung von ticket-api/nginx.conf.vorlage. TICKETS-API.EXAMPLE.DE ersetzen.

limit_req_zone $http_authorization zone=je_token:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=je_ip:10m    rate=60r/m;

log_format tickets_api '$time_iso8601 $remote_addr "$request_method $uri" '
                       '$status $body_bytes_sent ${request_time}s';

upstream postgrest_tickets { server 127.0.0.1:3100; keepalive 8; }

# HTTP: nur für die Zertifikatserneuerung (certbot), sonst Umleitung auf HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name TICKETS-API.EXAMPLE.DE;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name TICKETS-API.EXAMPLE.DE;

  ssl_certificate     /etc/letsencrypt/live/TICKETS-API.EXAMPLE.DE/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/TICKETS-API.EXAMPLE.DE/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS_TICKETS:1m;

  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Cache-Control             "no-store" always;

  # Keine Bodies, keine Query-Strings, keine Tokens im Log
  access_log /var/log/nginx/tickets-api.log tickets_api;
  error_log  /var/log/nginx/tickets-api-fehler.log warn;

  # Freigegebene Absender — Datei siehe Betriebshandbuch
  include /etc/luemobil/erlaubte_ips.conf;

  client_max_body_size 1k;
  limit_req_status 429;

  location = /rpc/tickets_fuer_email {
    limit_except POST { deny all; }
    limit_req zone=je_token burst=10 nodelay;
    limit_req zone=je_ip    burst=20 nodelay;

    if ($http_authorization !~ "^Bearer .+") { return 401; }

    proxy_pass http://postgrest_tickets;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Content-Location;
  }

  location / { return 404; }
}
